# Builds the sideloading IPA (Tools/make_ipa.sh) on a GitHub macOS runner.
# Unsigned: AltStore, SideStore and the like re-sign it with the user's Apple ID,
# so no certificates are needed here.
#
# Releases: tag main vX.Y.Z after a merge -> stable release. Tag a branch
# vX.Y.Z-rc.N (the version its merge will get) -> pre-release, never "Latest".
# Notes come from that version's CHANGELOG.md entries. "Run workflow" builds
# any branch as a downloadable artifact, without a release.
name: IPA

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Same Xcode as local builds: swift-collections is pinned for its Swift 6.1.
      - name: Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app && xcodebuild -version

      - name: Tools
        run: brew install xcodegen ninja

      # llama.cpp's static libraries only change with the submodule or the script.
      - name: Submodule commit
        id: sub
        run: echo "sha=$(git rev-parse HEAD:Vendor/llama.cpp)" >> "$GITHUB_OUTPUT"

      - name: Restore llama.cpp
        id: cache
        uses: actions/cache@v6
        with:
          path: Vendor/llama-cpu
          key: llama-${{ steps.sub.outputs.sha }}-${{ hashFiles('Tools/build_llama_ios.sh', 'Tools/llama/module.modulemap') }}

      - name: Build llama.cpp
        if: steps.cache.outputs.cache-hit != 'true'
        run: Tools/build_llama_ios.sh

      - name: Build IPA
        run: Tools/make_ipa.sh

      - uses: actions/upload-artifact@v7
        with:
          name: TsumuKey-ipa
          path: dist/*.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          Tools/release_notes.sh "$TAG" > notes.md
          case "$TAG" in *-*) pre=--prerelease ;; *) pre=--latest ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.ipa --clobber
          else
            gh release create "$TAG" dist/*.ipa $pre --title "TsumuKey ${TAG#v}" --notes-file notes.md
          fi
