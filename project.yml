# Generate the Xcode project with: xcodegen generate
name: TsumuKey
options:
  bundleIdPrefix: com.tsumukey
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Your Apple developer team: TSUMUKEY_TEAM=XXXXXXXXXX xcodegen generate
    DEVELOPMENT_TEAM: ${TSUMUKEY_TEAM}
    CODE_SIGN_STYLE: Automatic
    # Optimized even in Debug: the decoder's per-word loops run ~5x slower
    # unoptimized, which made typing feel laggy.
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    MARKETING_VERSION: "0.13.0"
    CURRENT_PROJECT_VERSION: "101"
packages:
  # azooKey's kana-kanji converter (MIT) with its default dictionary.
  AzooKeyKanaKanjiConverter:
    # Fork of 0.11.2 with Zenzai's llama.cpp target removed: Xcode 16 ignores
    # package traits, so it was linked but never embedded (launch crash).
    url: https://github.com/Iito/AzooKeyKanaKanjiConverter
    exactVersion: 0.11.2-tsumukey.1
  # Pinned: newer releases need Swift tools 6.4, Xcode 16.4 has 6.1.
  swift-collections:
    url: https://github.com/apple/swift-collections
    exactVersion: 1.6.0
targets:
  TsumuKey:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    entitlements:
      path: App/TsumuKey.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tsumukey]
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: TsumuKey
        UILaunchScreen: {}
        # Daily exchange rates (Currency conversion, off by default).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [tsumukey-rates]
        # Lets the keyboard's long-press "settings" option open the app.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [tsumukey]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsumukey
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/llama-cpu/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/llama-cpu/lib/$(PLATFORM_NAME)
    preBuildScripts:
      - name: Check llama.cpp
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "$SRCROOT/Vendor/llama-cpu/lib/$PLATFORM_NAME/libllama.a" ]; then
            echo "error: llama.cpp isn't built. Run Tools/build_llama_ios.sh once (needs cmake and ninja)."
            exit 1
          fi
    dependencies:
      - target: Keyboard

  Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
      # Word list for English, French, German, Spanish, Italian and Portuguese.
      # Gemma is no longer bundled: the app downloads it on request (Shared/ModelStore.swift).
      - path: Models/lexicon-eu6.bin
        buildPhase: resources
      # Korean words for the Hangul keyboards' completions (FrequencyWords, OpenSubtitles 2018).
      - path: Models/words-ko.txt
        buildPhase: resources
      # Korean words filed under their Dubeolsik keys, for touch-aware corrections.
      - path: Models/lexicon-ko.bin
        buildPhase: resources
      # Small candidate rankers: dense head and mixture-of-experts head.
      - path: Models/ranker-dense.rank
        buildPhase: resources
      - path: Models/ranker-moe.rank
        buildPhase: resources
      # Language detector for "Detect Language" (26 European languages, 3.4 MB, memory-mapped).
      - path: Models/langid.tkl
        buildPhase: resources
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.tsumukey]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: TsumuKey
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Needed to read settings from the app through the App Group.
            # iOS shows users a privacy warning when they turn it on.
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsumukey.keyboard
        # llama.cpp, CPU-only static build (Tools/build_llama_ios.sh).
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/llama-cpu/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/llama-cpu/lib/$(PLATFORM_NAME)
    preBuildScripts:
      - name: Check llama.cpp
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "$SRCROOT/Vendor/llama-cpu/lib/$PLATFORM_NAME/libllama.a" ]; then
            echo "error: llama.cpp isn't built. Run Tools/build_llama_ios.sh once (needs cmake and ninja)."
            exit 1
          fi
    dependencies:
      - package: AzooKeyKanaKanjiConverter
        product: KanaKanjiConverterModuleWithDefaultDictionary

  TsumuKeyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tsumukey.uitests
        TEST_TARGET_NAME: TsumuKey
        SWIFT_OBJC_BRIDGING_HEADER: UITests/UITests-Bridging-Header.h
    dependencies:
      - target: TsumuKey

schemes:
  TsumuKey:
    build:
      targets:
        TsumuKey: all
    test:
      targets: [TsumuKeyUITests]
